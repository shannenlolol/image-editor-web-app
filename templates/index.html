<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Editor</title>
    <script src="/static/theme.js"></script>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/assets/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/static/assets/favicon.png" />
    <!-- Include the Cropper CSS file -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.9/cropper.min.css" rel="stylesheet" />
    <!-- Link to your custom CSS file -->
    <link href="/static/style.css" rel="stylesheet" />
</head>

<body>
    <div class="page-wrapper">
        <nav class="navbar">
            <div class="nav-left">
                <img src="/static/assets/ImageEditorIcon.png" alt="Logo" class="nav-logo" />
                <h1>Image Editor</h1>
            </div>
            <div class="nav-right">
                <button type="button" id="themeToggle" class="theme-toggle" aria-label="Dark mode"
                    aria-pressed="false" title="Switch to dark mode">
                    <span class="theme-option theme-sun" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                            <circle cx="12" cy="12" r="4" />
                            <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" />
                        </svg>
                    </span>
                    <span class="theme-option theme-moon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z" />
                        </svg>
                    </span>
                </button>
                <label for="imageInput" class="upload-btn">Upload Images</label>
                <input type="file" id="imageInput" accept="image/*" multiple />
                <div class="download-control" id="downloadControl">
                    <button type="button" id="downloadMenuButton" class="download-btn" aria-expanded="false"
                        aria-controls="downloadMenu" disabled>
                        Download <span aria-hidden="true" style="margin-left: 4px;">▾</span>
                    </button>
                    <div id="downloadMenu" class="download-menu" hidden>
                        <button type="button" id="downloadCurrent">
                            Download current image
                        </button>
                        <button type="button" id="downloadAll">
                            Download all as ZIP
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <p id="downloadStatus" class="download-status" role="status" aria-live="polite" hidden></p>
        <main class="main-container">
            <nav class="tool-rail" aria-label="Editing tools">
                <button type="button" id="cropTool" class="tool-button" aria-label="Crop" title="Crop"
                    aria-controls="cropPanel" aria-expanded="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M6 3v13a2 2 0 0 0 2 2h13M3 6h13a2 2 0 0 1 2 2v13" />
                    </svg>
                </button>
                <button type="button" id="backgroundTool" class="tool-button" aria-label="Background" title="Background"
                    aria-controls="backgroundPanel" aria-expanded="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" rx="4" />
                        <path d="M12 3v18" />
                        <path d="M12 7h9M12 12h9M12 17h9" />
                    </svg>
                </button>
                <button type="button" id="rotationTool" class="tool-button" aria-label="Rotate &amp; flip"
                    title="Rotate &amp; flip" aria-controls="rotationPanel" aria-expanded="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"
                        stroke-linejoin="miter" aria-hidden="true">
                        <path d="M6.5 9 8 4l12 4-0.4 1M5.5 15 5 17l12 4 2-6M2 12h20" />
                    </svg>
                </button>
                <button type="button" id="resetButton" class="tool-button reset-tool" aria-label="Reset to Original"
                    title="Reset to Original">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 10a9 9 0 1 1 2 8M3 4v6h6" />
                    </svg>
                </button>
            </nav>
            <aside class="tool-panel" id="toolPanel" aria-label="Tool settings">
                <div class="tool-panel-header">
                    <h2 id="toolPanelTitle">Crop</h2>
                    <button type="button" id="closeToolPanel" class="icon-button" aria-label="Close tool panel"
                        title="Close tool panel">
                        ×
                    </button>
                </div>
                <section id="cropPanel" aria-labelledby="cropTool">
                    <fieldset id="cropControls" class="tool-controls" disabled>
                        <div class="control-section resolution-fields">
                            <div class="dimension-row">
                                <label for="widthInput">Width</label>
                                <input type="number" id="widthInput" aria-label="Width in pixels" min="1" step="1" />
                            </div>
                            <div class="dimension-row">
                                <label for="heightInput">Height</label>
                                <input type="number" id="heightInput" aria-label="Height in pixels" min="1" step="1" />
                            </div>
                        </div>
                        <div class="control-section">
                            <label class="control-label" id="presetLabel" for="presetTrigger">Preset</label>
                            <div class="preset-dropdown" id="presetDropdown">
                                <button type="button" id="presetTrigger" aria-haspopup="listbox" aria-expanded="false"
                                    aria-controls="presetMenu" aria-labelledby="presetLabel presetValue">
                                    <span id="presetValue">Original</span><span aria-hidden="true">⌄</span>
                                </button>
                                <div id="presetMenu" class="preset-menu" role="listbox" aria-labelledby="presetLabel"
                                    hidden>
                                    <button type="button" id="presetFree" role="option" aria-selected="false"
                                        tabindex="-1">
                                        None
                                    </button>
                                    <button type="button" id="presetOriginal" role="option" aria-selected="true"
                                        tabindex="-1">
                                        Original
                                    </button>
                                    <button type="button" id="presetSquare" role="option" aria-selected="false"
                                        tabindex="-1">
                                        1:1 (Square)
                                    </button>
                                    <button type="button" id="presetPortrait" role="option" aria-selected="false"
                                        tabindex="-1">
                                        4:5 (Portrait)
                                    </button>
                                    <button type="button" id="presetStory" role="option" aria-selected="false"
                                        tabindex="-1">
                                        9:16 (Story)
                                    </button>
                                </div>
                            </div>
                            <select id="aspectRatioPreset" hidden aria-hidden="true" tabindex="-1">
                                <option value="free">None</option>
                                <option value="original" selected>Original</option>
                                <option value="1">1:1 (Square)</option>
                                <option value="0.8">4:5 (Portrait)</option>
                                <option value="0.5625">9:16 (Story)</option>
                                <option value="custom" disabled hidden>
                                    Custom
                                </option>
                            </select>
                        </div>
                    </fieldset>
                </section>
                <section id="rotationPanel" aria-labelledby="rotationTool" hidden>
                    <fieldset id="rotationControls" class="rotation-controls tool-controls" disabled>
                        <!-- <legend class="control-label">Rotate &amp; flip</legend> -->
                        <div class="rotation-actions">
                            <button type="button" id="rotateLeft" aria-label="Rotate left 90 degrees"
                                title="Rotate left 90°">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M3 10a8 8 0 1 1 2 8M3 4v6h6" />
                                </svg>
                            </button>
                            <button type="button" id="rotateRight" aria-label="Rotate right 90 degrees"
                                title="Rotate right 90°">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M21 10a8 8 0 1 0-2 8M21 4v6h-6" />
                                </svg>
                            </button>
                            <button type="button" id="flipHorizontal" aria-label="Flip horizontally"
                                aria-pressed="false" title="Flip horizontally">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M12 3v18M8 5 3 19h5ZM16 5l5 14h-5Z" />
                                </svg>
                            </button>
                            <button type="button" id="flipVertical" aria-label="Flip vertically" aria-pressed="false"
                                title="Flip vertically">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M3 12h18M5 8l14-5v5ZM5 16l14 5v-5Z" />
                                </svg>
                            </button>
                        </div>
                        <div class="dimension-row rotation-angle-row">
                            <label for="rotationAngle">Angle</label>
                            <div class="rotation-angle-input">
                                <input type="number" id="rotationAngle" min="-180" max="180" step="0.1"
                                    value="0" /><span aria-hidden="true">°</span>
                            </div>
                        </div>
                        <input type="range" id="rotationSlider" aria-label="Rotation angle in degrees" min="-180"
                            max="180" step="0.1" value="0" />
                        <div class="rotation-range-labels" aria-hidden="true">
                            <span>−180°</span><span>0°</span><span>180°</span>
                        </div>
                    </fieldset>
                </section>
                <section id="backgroundPanel" aria-labelledby="backgroundTool" hidden>
                    <fieldset id="backgroundControls" class="tool-controls" disabled>
                        <div class="background-removal-row">
                            <div>
                                <label for="removeBg">Remove background</label>
                                <p id="removeBgHelp">
                                    Cuts out the subject automatically
                                </p>
                            </div>
                            <input type="checkbox" id="removeBg" class="background-switch" role="switch"
                                aria-describedby="removeBgHelp" />
                        </div>
                        <fieldset class="background-replacements" id="backgroundReplacements">
                            <legend>Background Colour</legend>
                            <div class="background-swatches">
                                <button type="button" id="transparentBg" class="background-swatch transparent-swatch"
                                    aria-label="Transparent background" aria-pressed="true"
                                    title="Transparent"></button>
                                <button type="button" id="whiteBg" class="background-swatch white-swatch"
                                    aria-label="White background" aria-pressed="false" title="White"></button>
                                <button type="button" id="blackBg" class="background-swatch black-swatch"
                                    aria-label="Black background" aria-pressed="false" title="Black"></button>
                                <div class="custom-background">
                                    <button type="button" id="customBg" class="background-swatch custom-swatch"
                                        aria-label="Custom background colour" aria-pressed="false"
                                        title="Custom colour">
                                        +
                                    </button>
                                    <input type="color" id="bgColor" value="#ffffff"
                                        aria-label="Custom background colour picker" tabindex="-1" />
                                </div>
                            </div>
                        </fieldset>
                    </fieldset>
                </section>
            </aside>
            <div class="editor-section">
                <div class="image-container" id="dropZone">
                    <div class="loading-overlay" id="loadingOverlay">
                        <div class="spinner"></div>
                        <p>Processing image...</p>
                    </div>
                    <div class="upload-placeholder" id="uploadPlaceholder">
                        <div class="upload-content">
                            <p class="no-image-text">
                                Drag and drop images here or
                            </p>
                            <label for="imageInput" class="upload-btn">Upload Images</label>
                        </div>
                    </div>
                    <img id="image" style="display: none" />
                </div>

                <div class="zoom-controls">
                    <button type="button" id="zoomOut" aria-label="Zoom out" title="Zoom Out">-</button>
                    <button type="button" id="zoomIn" aria-label="Zoom in" title="Zoom In">+</button>
                </div>
            </div>

            <aside class="images-rail" aria-labelledby="imagesTitle">
                <h2 id="imagesTitle">Images</h2>
                <div class="batch-empty-state" id="batchEmptyState">
                    <p class="batch-empty-title">No images yet</p>
                </div>
                <div class="batch-images" id="batchImages" hidden></div>
                <button type="button" id="batchUploadButton" class="batch-upload-button">
                    + Add images
                </button>
            </aside>
        </main>

        <!-- Include the Cropper JS file -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.9/cropper.min.js"></script>
        <script src="/static/vendor/jszip.min.js"></script>
        <script src="/static/editor.js"></script>
        <script src="/static/controls.js"></script>
    </div>
</body>

</html>
