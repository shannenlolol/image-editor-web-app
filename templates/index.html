<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Editor</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/assets/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/static/assets/favicon.png">
    <!-- Include the Cropper CSS file -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.9/cropper.min.css" rel="stylesheet" />
    <!-- Link to your custom CSS file -->
    <link href="/static/style.css" rel="stylesheet" />
</head>

<body>
    <div class="page-wrapper">
        <nav class="navbar">
            <div class="nav-left">
                <img src="/static/assets/ImageEditorIcon.png" alt="Logo" class="nav-logo">
                <h1>Image Editor</h1>
            </div>
            <div class="nav-right">
                <label for="imageInput" class="upload-btn">Upload Images</label>
                <input type="file" id="imageInput" accept="image/*" multiple>
                <button id="cropButton" class="download-btn">Download</button>
            </div>
        </nav>


        <main class="main-container">
            <nav class="tool-rail" aria-label="Editing tools">
                <button type="button" id="cropTool" class="tool-button" aria-label="Crop" title="Crop" aria-controls="cropPanel" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v13a2 2 0 0 0 2 2h13M3 6h13a2 2 0 0 1 2 2v13"/></svg></button>
                <button type="button" id="backgroundTool" class="tool-button" aria-label="Background" title="Background" aria-controls="backgroundPanel" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 3v18"/><path d="M12 7h9M12 12h9M12 17h9"/></svg></button>
                <button type="button" id="rotationTool" class="tool-button" aria-label="Rotate &amp; flip" title="Rotate &amp; flip" aria-controls="rotationPanel" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6.5 9 8 4l12 4-0.4 1M5.5 15 5 17l12 4 2-6M2 12h20"/></svg></button>
                <button type="button" id="resetButton" class="tool-button reset-tool" aria-label="Reset to Original" title="Reset to Original"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg></button>
            </nav>
            <aside class="tool-panel" id="toolPanel" aria-label="Tool settings">
                <div class="tool-panel-header">
                    <h2 id="toolPanelTitle">Crop</h2>
                    <button type="button" id="closeToolPanel" class="icon-button" aria-label="Close tool panel" title="Close tool panel">×</button>
                </div>
                <section id="cropPanel" aria-labelledby="cropTool">
                    <fieldset id="cropControls" class="tool-controls" disabled>
                        <div class="control-section resolution-fields">
                            <div class="dimension-row">
                                <label for="widthInput">Width</label>
                                <input type="number" id="widthInput" aria-label="Width in pixels" min="1" step="1">
                            </div>
                            <div class="dimension-row">
                                <label for="heightInput">Height</label>
                                <input type="number" id="heightInput" aria-label="Height in pixels" min="1" step="1">
                            </div>
                        </div>
                        <div class="control-section">
                            <label class="control-label" id="presetLabel" for="presetTrigger">Preset</label>
                            <div class="preset-dropdown" id="presetDropdown">
                                <button type="button" id="presetTrigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="presetMenu" aria-labelledby="presetLabel presetValue"><span id="presetValue">None</span><span aria-hidden="true">⌄</span></button>
                                <div id="presetMenu" class="preset-menu" role="listbox" aria-labelledby="presetLabel" hidden>
                                    <button type="button" id="presetFree" role="option" aria-selected="true" tabindex="-1">None</button>
                                    <button type="button" id="presetOriginal" role="option" aria-selected="false" tabindex="-1">Original</button>
                                    <button type="button" id="presetSquare" role="option" aria-selected="false" tabindex="-1">1:1 (Square)</button>
                                    <button type="button" id="presetPortrait" role="option" aria-selected="false" tabindex="-1">4:5 (Portrait)</button>
                                    <button type="button" id="presetStory" role="option" aria-selected="false" tabindex="-1">9:16 (Story)</button>
                                </div>
                            </div>
                            <select id="aspectRatioPreset" hidden aria-hidden="true" tabindex="-1">
                                <option value="free">None</option>
                                <option value="original">Original</option>
                                <option value="1">1:1 (Square)</option>
                                <option value="0.8">4:5 (Portrait)</option>
                                <option value="0.5625">9:16 (Story)</option>
                                <option value="custom" disabled hidden>Custom</option>
                            </select>
                        </div>
                    </fieldset>
                </section>
                <section id="rotationPanel" aria-labelledby="rotationTool" hidden>
                    <fieldset id="rotationControls" class="rotation-controls tool-controls" disabled>
                        <!-- <legend class="control-label">Rotate &amp; flip</legend> -->
                        <div class="rotation-actions">
                            <button type="button" id="rotateLeft" aria-label="Rotate left 90 degrees" title="Rotate left 90°"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a8 8 0 1 1 2 8M3 4v6h6"/></svg></button>
                            <button type="button" id="rotateRight" aria-label="Rotate right 90 degrees" title="Rotate right 90°"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10a8 8 0 1 0-2 8M21 4v6h-6"/></svg></button>
                            <button type="button" id="flipHorizontal" aria-label="Flip horizontally" aria-pressed="false" title="Flip horizontally"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M8 5 3 19h5ZM16 5l5 14h-5Z"/></svg></button>
                            <button type="button" id="flipVertical" aria-label="Flip vertically" aria-pressed="false" title="Flip vertically"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18M5 8l14-5v5ZM5 16l14 5v-5Z"/></svg></button>
                        </div>
                        <div class="dimension-row rotation-angle-row">
                            <label for="rotationAngle">Angle</label>
                            <div class="rotation-angle-input"><input type="number" id="rotationAngle" min="-180" max="180" step="0.1" value="0"><span aria-hidden="true">°</span></div>
                        </div>
                        <input type="range" id="rotationSlider" aria-label="Rotation angle in degrees" min="-180" max="180" step="0.1" value="0">
                        <div class="rotation-range-labels" aria-hidden="true"><span>−180°</span><span>0°</span><span>180°</span></div>
                    </fieldset>
                </section>
                <section id="backgroundPanel" aria-labelledby="backgroundTool" hidden>
                    <fieldset id="backgroundControls" class="tool-controls" disabled>
                        <div class="background-removal-row">
                            <div>
                                <label for="removeBg">Remove background</label>
                                <p id="removeBgHelp">Cuts out the subject automatically</p>
                            </div>
                            <input type="checkbox" id="removeBg" class="background-switch" role="switch" aria-describedby="removeBgHelp">
                        </div>
                        <fieldset class="background-replacements" id="backgroundReplacements">
                            <legend>Background Colour</legend>
                            <div class="background-swatches">
                                <button type="button" id="transparentBg" class="background-swatch transparent-swatch" aria-label="Transparent background" aria-pressed="true" title="Transparent"></button>
                                <button type="button" id="whiteBg" class="background-swatch white-swatch" aria-label="White background" aria-pressed="false" title="White"></button>
                                <button type="button" id="blackBg" class="background-swatch black-swatch" aria-label="Black background" aria-pressed="false" title="Black"></button>
                                <div class="custom-background">
                                    <button type="button" id="customBg" class="background-swatch custom-swatch" aria-label="Custom background colour" aria-pressed="false" title="Custom colour">+</button>
                                    <input type="color" id="bgColor" value="#ffffff" aria-label="Custom background colour picker" tabindex="-1">
                                </div>
                            </div>
                        </fieldset>
                    </fieldset>
                </section>
            </aside>
            <div class="editor-section">
                <div class="image-container" id="dropZone">
                    <div class="loading-overlay" id="loadingOverlay">
                        <div class="spinner"></div>
                        <p>Processing image...</p>
                    </div>
                    <div class="upload-placeholder" id="uploadPlaceholder">
                        <div class="upload-content">
                            <p class="no-image-text">Drag and drop images here or</p>
                            <label for="imageInput" class="upload-btn">Upload Images</label>
                        </div>
                    </div>
                    <img id="image" style="display: none;">
                </div>

                <div class="zoom-controls">
                    <button id="zoomOut" title="Zoom Out">-</button>
                    <button id="zoomIn" title="Zoom In">+</button>
                </div>
            </div>


            <aside class="images-rail" aria-labelledby="imagesTitle">
                <h2 id="imagesTitle">Images</h2>
                <div class="batch-empty-state" id="batchEmptyState">
                    <p class="batch-empty-title">No images yet</p>
                </div>
                <div class="batch-images" id="batchImages" hidden></div>
                <button type="button" id="batchUploadButton" class="batch-upload-button">+ Add images</button>
            </aside>
        </main>

        <!-- Include the Cropper JS file -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.9/cropper.min.js"></script>
        <script>
            let cropper = null;
            let originalImage = null;
            let imageRequestId = 0;
            let imageAbortController = null;
            let displayedImageUrl = null;
            let currentFileName = '';
            let originalDimensions = null;
            let selectedBackground = 'transparent';
            let rotationAngle = 0;
            let horizontalScale = 1;
            let verticalScale = 1;
            const imageElement = document.getElementById('image');
            const inputElement = document.getElementById('imageInput');
            const removeBgCheckbox = document.getElementById('removeBg');
            const widthInput = document.getElementById('widthInput');
            const heightInput = document.getElementById('heightInput');
            const bgColorInput = document.getElementById('bgColor');
            const transparentBgButton = document.getElementById('transparentBg');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const uploadPlaceholder = document.getElementById('uploadPlaceholder');

            const toolPanel = document.getElementById('toolPanel');
            const toolButtons = {
                crop: document.getElementById('cropTool'),
                background: document.getElementById('backgroundTool'),
                rotation: document.getElementById('rotationTool'),
            };
            let activeTool = 'crop';

            const presetSelect = document.getElementById('aspectRatioPreset');
            const presetTrigger = document.getElementById('presetTrigger');
            const presetMenu = document.getElementById('presetMenu');
            const presetDropdown = document.getElementById('presetDropdown');
            const presetChoices = [
                ['free', 'presetFree', 'None'],
                ['original', 'presetOriginal', 'Original'],
                ['1', 'presetSquare', '1:1 (Square)'],
                ['0.8', 'presetPortrait', '4:5 (Portrait)'],
                ['0.5625', 'presetStory', '9:16 (Story)'],
            ];
            let presetOpen = false;
            let focusedPreset = 0;

            function syncPresetMenu() {
                const choice = presetChoices.find(([value]) => value === presetSelect.value);
                document.getElementById('presetValue').textContent = choice ? choice[2] : 'Custom';
                for (const [value, id] of presetChoices) {
                    document.getElementById(id).setAttribute('aria-selected', String(value === presetSelect.value));
                }
            }

            function closePresetMenu(restoreFocus = false) {
                presetOpen = false;
                presetMenu.hidden = true;
                presetTrigger.setAttribute('aria-expanded', 'false');
                if (restoreFocus) presetTrigger.focus();
            }

            function focusPreset(index) {
                focusedPreset = (index + presetChoices.length) % presetChoices.length;
                document.getElementById(presetChoices[focusedPreset][1]).focus();
            }

            function openPresetMenu() {
                syncPresetMenu();
                presetOpen = true;
                presetMenu.hidden = false;
                presetTrigger.setAttribute('aria-expanded', 'true');
                focusPreset(Math.max(0, presetChoices.findIndex(([value]) => value === presetSelect.value)));
            }

            presetTrigger.addEventListener('click', () => presetOpen ? closePresetMenu() : openPresetMenu());
            presetTrigger.addEventListener('keydown', event => {
                if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                    event.preventDefault();
                    openPresetMenu();
                }
            });
            for (const [value, id] of presetChoices) {
                document.getElementById(id).addEventListener('click', () => {
                    presetSelect.value = value;
                    presetSelect.dispatchEvent(new Event('change'));
                    syncPresetMenu();
                    closePresetMenu(true);
                });
            }
            presetMenu.addEventListener('keydown', event => {
                if (['ArrowDown', 'ArrowUp', 'Home', 'End', 'Escape'].includes(event.key)) {
                    event.preventDefault();
                    event.stopPropagation();
                    if (event.key === 'Escape') closePresetMenu(true);
                    else if (event.key === 'Home') focusPreset(0);
                    else if (event.key === 'End') focusPreset(presetChoices.length - 1);
                    else focusPreset(focusedPreset + (event.key === 'ArrowDown' ? 1 : -1));
                }
            });
            presetDropdown.addEventListener('focusout', event => {
                if (!presetDropdown.contains(event.relatedTarget)) closePresetMenu();
            });
            document.addEventListener('click', event => {
                if (!presetDropdown.contains(event.target)) closePresetMenu();
            });


            function setActiveTool(tool) {
                closePresetMenu();
                activeTool = tool;
                toolPanel.hidden = !tool;
                for (const name of Object.keys(toolButtons)) {
                    toolButtons[name].setAttribute('aria-expanded', String(name === tool));
                    document.getElementById(name + 'Panel').hidden = name !== tool;
                }
                if (tool) document.getElementById('toolPanelTitle').textContent = ({ crop: 'Crop', background: 'Background', rotation: 'Rotate & flip' })[tool];
            }

            for (const [name, button] of Object.entries(toolButtons)) {
                button.addEventListener('click', () => setActiveTool(activeTool === name ? null : name));
            }
            function closeToolPanel() {
                const previousTool = activeTool;
                setActiveTool(null);
                if (previousTool) toolButtons[previousTool].focus();
            }
            document.getElementById('closeToolPanel').addEventListener('click', closeToolPanel);
            toolPanel.addEventListener('keydown', event => {
                if (event.key === 'Escape') {
                    event.preventDefault();
                    closeToolPanel();
                }
            });
            // Let Cropper preserve its crop data when the available canvas space changes.
            if (typeof ResizeObserver !== 'undefined') {
                new ResizeObserver(() => {
                    if (cropper && cropper.ready) cropper.resize();
                }).observe(document.getElementById('dropZone'));
            }

            function syncRotationControls() {
                document.getElementById('rotationAngle').value = String(rotationAngle);
                document.getElementById('rotationSlider').value = String(rotationAngle);
                document.getElementById('rotationSlider').setAttribute('aria-valuetext', rotationAngle + ' degrees');
                document.getElementById('flipHorizontal').setAttribute('aria-pressed', String(horizontalScale === -1));
                document.getElementById('flipVertical').setAttribute('aria-pressed', String(verticalScale === -1));
            }

            function applyImageTransform() {
                cropper.rotateTo(rotationAngle);
                cropper.scale(horizontalScale, verticalScale);
            }

            function resetImageTransform() {
                rotationAngle = 0;
                horizontalScale = 1;
                verticalScale = 1;
                syncRotationControls();
            }

            function setRotation(value) {
                if (!cropper || !cropper.ready || !Number.isFinite(value)) return;
                rotationAngle = Math.round((((value + 180) % 360 + 360) % 360 - 180) * 10) / 10;
                // Keep the positive endpoint at the right end of the slider.
                if (rotationAngle === -180 && value > 0) rotationAngle = 180;
                cropper.rotateTo(rotationAngle);
                syncRotationControls();
            }
            document.getElementById('rotateLeft').addEventListener('click', () => setRotation(rotationAngle - 90));
            document.getElementById('rotateRight').addEventListener('click', () => setRotation(rotationAngle + 90));
            for (const id of ['rotationAngle', 'rotationSlider']) {
                document.getElementById(id).addEventListener('input', event => {
                    const value = Number(event.target.value);
                    if (event.target.value.trim() && value >= -180 && value <= 180) setRotation(value);
                });
            }
            document.getElementById('flipHorizontal').addEventListener('click', () => {
                if (!cropper || !cropper.ready) return;
                horizontalScale *= -1;
                cropper.scaleX(horizontalScale);
                syncRotationControls();
            });
            document.getElementById('flipVertical').addEventListener('click', () => {
                if (!cropper || !cropper.ready) return;
                verticalScale *= -1;
                cropper.scaleY(verticalScale);
                syncRotationControls();
            });

            function showLoading() {
                loadingOverlay.style.display = 'flex';
            }

            function hideLoading() {
                loadingOverlay.style.display = 'none';
            }

            function updateBackgroundColor(color) {
                if (cropper) {
                    cropper.options.fillColor = color;
                    const viewBox = document.querySelector('.cropper-view-box');
                    const preview = document.querySelector('#preview');
                    const bgPattern = 'repeating-conic-gradient(#FFFFFF 0% 25%, #E8E8E8 0% 50%) 50% / 20px 20px';

                    if (viewBox) {
                        if (color === 'transparent') {
                            viewBox.style.background = bgPattern;
                        } else {
                            viewBox.style.background = color;
                        }
                    }

                    if (preview) {
                        preview.style.background = color === 'transparent' ? bgPattern : color;
                    }


                }
            }

            function initCropper() {
                const requestId = imageRequestId;
                if (cropper) {
                    cropper.destroy();
                }

                imageElement.style.display = 'block';
                uploadPlaceholder.style.display = 'none';
                const preset = document.getElementById('aspectRatioPreset');
                const ratio = preset.value === 'free' ? NaN
                    : preset.value === 'original' ? originalDimensions.width / originalDimensions.height
                    : preset.value === 'custom' ? Number(widthInput.value) / Number(heightInput.value)
                    : Number(preset.value);

                const options = {
                    aspectRatio: ratio,
                    viewMode: 0, // Changed back to viewMode 0 for completely free movement
                    autoCropArea: 1,
                    background: true,
                    responsive: true,
                    restore: true,
                    center: true,
                    highlight: false,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    guides: true,
                    dragMode: 'crop',
                    toggleDragModeOnDblclick: true,
                    fillColor: selectedBackground,
                    minContainerWidth: 0,
                    minContainerHeight: 0,
                    minCropBoxWidth: 10,
                    minCropBoxHeight: 10,
                    minCanvasWidth: 0,
                    minCanvasHeight: 0,
                    movable: true,
                    scalable: true,
                    zoomable: true,
                    rotatable: true,
                    wheelZoomRatio: 0.1,
                    minZoom: 0.01, // Allow zooming out to 1% of original size
                    maxZoom: 100, // Allow zooming in to 10000% of original size
                    ready: function () {
                        if (requestId !== imageRequestId || !cropper) return;
                        applyImageTransform();
                        setToolControlsDisabled(false);
                        updateBackgroundColor(selectedBackground);
                        const cropBox = document.querySelector('.cropper-crop-box');
                        if (cropBox) {
                            cropBox.style.cursor = 'move';
                            const handles = cropBox.querySelectorAll('.cropper-point');
                            handles.forEach(handle => {
                                handle.style.cursor = 'pointer';
                                handle.style.width = '14px';
                                handle.style.height = '14px';
                            });
                            const edges = cropBox.querySelectorAll('.cropper-line');
                            edges.forEach(edge => {
                                edge.style.cursor = 'move';
                            });
                        }

                        // Set initial zoom to fit the container
                        const container = document.querySelector('.image-container');
                        if (container) {
                            const containerWidth = container.clientWidth;
                            const containerHeight = container.clientHeight;
                            const imageData = cropper.getImageData();
                            const scale = Math.min(
                                (containerWidth - 50) / imageData.naturalWidth,
                                (containerHeight - 50) / imageData.naturalHeight
                            );
                            cropper.zoomTo(scale);

                            // Center the view
                            setTimeout(() => {
                                if (requestId !== imageRequestId) return;
                                container.scrollLeft = (container.scrollWidth - container.clientWidth) / 2;
                                container.scrollTop = (container.scrollHeight - container.clientHeight) / 2;
                            }, 100);
                        }
                    }
                };

                cropper = new Cropper(imageElement, options);

                // Remove existing event listeners before adding new ones
                const zoomIn = document.getElementById('zoomIn');
                const zoomOut = document.getElementById('zoomOut');

                zoomIn.removeEventListener('click', null);
                zoomOut.removeEventListener('click', null);

                zoomIn.addEventListener('click', () => {
                    if (cropper) cropper.zoom(0.1);
                });

                zoomOut.addEventListener('click', () => {
                    if (cropper) cropper.zoom(-0.1);
                });
            }

            function setToolControlsDisabled(disabled) {
                for (const id of ['cropControls', 'backgroundControls', 'rotationControls']) {
                    document.getElementById(id).disabled = disabled;
                }
                if (disabled) closePresetMenu();
            }

            function invalidateImageProcessing() {
                setToolControlsDisabled(true);
                imageRequestId += 1;
                if (imageAbortController) {
                    imageAbortController.abort();
                    imageAbortController = null;
                }
                // Do not leave the previous image available under a new filename.
                if (cropper) {
                    cropper.destroy();
                    cropper = null;
                }
                imageElement.removeAttribute('src');
                imageElement.style.display = 'none';
                if (displayedImageUrl) {
                    URL.revokeObjectURL(displayedImageUrl);
                    displayedImageUrl = null;
                }
            }

            async function processImage(file, shouldRemoveBg = true, resetDimensions = true) {
                invalidateImageProcessing();
                const requestId = imageRequestId;
                const controller = new AbortController();
                imageAbortController = controller;
                let url = null;
                showLoading();

                try {
                    let blob = file;
                    if (shouldRemoveBg) {
                        const formData = new FormData();
                        formData.append('file', file);
                        const response = await fetch('/remove-bg', {
                            method: 'POST',
                            body: formData,
                            signal: controller.signal,
                        });
                        if (requestId !== imageRequestId) return;
                        blob = await response.blob();
                    }
                    if (requestId !== imageRequestId) return;

                    // Decode separately so an old image-load event cannot update the editor.
                    url = URL.createObjectURL(blob);
                    const preview = new Image();
                    preview.src = url;
                    await preview.decode();
                    if (requestId !== imageRequestId) return;

                    if (resetDimensions) {
                        resetImageTransform();
                        originalDimensions = { width: preview.naturalWidth, height: preview.naturalHeight };
                        widthInput.value = String(originalDimensions.width);
                        heightInput.value = String(originalDimensions.height);
                        document.getElementById('aspectRatioPreset').value = 'free';
                        syncPresetMenu();
                    }
                    imageElement.src = url;
                    displayedImageUrl = url;
                    initCropper();
                } catch (error) {
                    if (requestId !== imageRequestId || error.name === 'AbortError') return;
                    console.error('Error:', error);
                    alert('Error processing image. Please try again.');
                } finally {
                    if (url && url !== displayedImageUrl) URL.revokeObjectURL(url);
                    if (requestId === imageRequestId) {
                        imageAbortController = null;
                        hideLoading();
                    }
                }
            }

            // Handle background removal toggle
            removeBgCheckbox.addEventListener('change', function () {
                if (originalImage) {
                    processImage(originalImage, this.checked, false);
                }
            });

            // Ignore incomplete values while typing, and update without rebuilding the editor.
            function applyResolution() {
                const width = Number(widthInput.value);
                const height = Number(heightInput.value);
                if (!cropper || !Number.isSafeInteger(width) || !Number.isSafeInteger(height)
                    || width <= 0 || height <= 0) return;

                const ratio = width / height;
                cropper.setAspectRatio(ratio);
                document.getElementById('aspectRatioPreset').value =
                    [1, 0.8, 0.5625].includes(ratio) ? String(ratio) : 'custom';
                syncPresetMenu();
            }

            widthInput.addEventListener('input', applyResolution);
            heightInput.addEventListener('input', applyResolution);

            // Handle drag and drop functionality
            const dropZone = document.getElementById('dropZone');

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('drag-over');
            });

            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                const files = e.dataTransfer.files;
                if (files && files.length) {
                    handleFiles(Array.from(files));
                }
            });

            function handleFiles(files) {
                files.forEach((file, index) => {
                    // Process the first file immediately
                    if (index === 0) {
                        originalImage = file;  // Store the original file
                        currentFileName = file.name;  // Store the current file name
                        document.getElementById('uploadPlaceholder').style.display = 'none';
                        document.getElementById('image').style.display = 'block';
                        processImage(file, removeBgCheckbox.checked);
                    }
                    // Add all files to batch images
                    addToBatchImages(file);
                });
            }

            function updateBatchEmptyState() {
                const isEmpty = document.getElementById('batchImages').children.length === 0;
                document.getElementById('batchEmptyState').hidden = !isEmpty;
                document.getElementById('batchImages').hidden = isEmpty;
            }

            function updateSelectedThumbnail() {
                for (const thumbnail of document.getElementById('batchImages').children) {
                    thumbnail.firstElementChild.setAttribute('aria-pressed', String(thumbnail.imageFile === originalImage));
                }
            }

            document.getElementById('batchUploadButton').addEventListener('click', () => {
                inputElement.click();
            });
            updateBatchEmptyState();

            function addToBatchImages(file) {
                const batchContainer = document.getElementById('batchImages');
                const thumbnail = document.createElement('div');
                thumbnail.className = 'batch-thumbnail';
                thumbnail.imageFile = file;

                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.alt = '';
                const selectBtn = document.createElement('button');
                selectBtn.type = 'button';
                selectBtn.className = 'thumbnail-select';
                selectBtn.setAttribute('aria-label', 'Edit ' + file.name);
                selectBtn.appendChild(img);

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.type = 'button';
                removeBtn.setAttribute('aria-label', 'Remove ' + file.name);
                removeBtn.innerHTML = '×';
                removeBtn.onclick = (e) => {
                    e.stopPropagation();
                    thumbnail.remove();
                    URL.revokeObjectURL(img.src);
                    updateBatchEmptyState();
                    if (originalImage === file || batchContainer.children.length === 0) {
                        invalidateImageProcessing();
                        hideLoading();
                        document.getElementById('uploadPlaceholder').style.display = 'flex';
                        originalImage = null;
                        currentFileName = '';
                        if (!batchContainer.children.length) {
                            originalDimensions = null;
                            resetImageTransform();
                            widthInput.value = '';
                            heightInput.value = '';
                            document.getElementById('aspectRatioPreset').value = 'free';
                        syncPresetMenu();
                        }
                        if (batchContainer.firstElementChild) {
                            batchContainer.firstElementChild.click();
                        }
                    }
                    updateSelectedThumbnail();
                    const nextThumbnail = batchContainer.firstElementChild;
                    if (nextThumbnail) nextThumbnail.firstElementChild.focus();
                    else document.getElementById('batchUploadButton').focus();
                };

                const name = document.createElement('span');
                name.textContent = file.name;

                selectBtn.appendChild(name);
                thumbnail.appendChild(selectBtn);
                thumbnail.appendChild(removeBtn);
                batchContainer.appendChild(thumbnail);
                updateBatchEmptyState();
                updateSelectedThumbnail();

                thumbnail.addEventListener('click', () => {
                    originalImage = file;  // Store the clicked image as original
                    currentFileName = file.name;  // Update current file name
                    updateSelectedThumbnail();
                    document.getElementById('uploadPlaceholder').style.display = 'none';
                    document.getElementById('image').style.display = 'block';
                    processImage(file, removeBgCheckbox.checked);
                });
            }

            // Update file input handler
            inputElement.addEventListener('change', function (event) {
                const files = event.target.files;
                if (files && files.length) {
                    handleFiles(Array.from(files));
                }
            });

            // Reset functionality - resets image to original state
            document.getElementById('resetButton').addEventListener('click', function () {
                if (originalImage && cropper) {
                    processImage(originalImage, removeBgCheckbox.checked);
                }
            });

            document.getElementById('aspectRatioPreset').addEventListener('change', function () {
                syncPresetMenu();
                if (!cropper) return;
                const ratio = this.value === 'original'
                    ? originalDimensions.width / originalDimensions.height
                    : this.value === 'free' ? NaN : Number(this.value);
                cropper.setAspectRatio(ratio);
                if (this.value === 'original') {
                    widthInput.value = String(originalDimensions.width);
                    heightInput.value = String(originalDimensions.height);
                } else if (Number.isFinite(ratio) && ratio > 0) {
                    // Use the updated crop's pixel width, not stale output dimensions.
                    const width = Math.max(1, Math.round(cropper.getData().width));
                    widthInput.value = String(width);
                    heightInput.value = String(Math.max(1, Math.round(width / ratio)));
                }
            });

            function selectBackground(color, activeButton) {
                selectedBackground = color;
                for (const id of ['transparentBg', 'whiteBg', 'blackBg', 'customBg']) {
                    document.getElementById(id).setAttribute('aria-pressed', String(id === activeButton));
                }
                updateBackgroundColor(color);
            }

            transparentBgButton.addEventListener('click', () => selectBackground('transparent', 'transparentBg'));
            document.getElementById('whiteBg').addEventListener('click', () => selectBackground('#ffffff', 'whiteBg'));
            document.getElementById('blackBg').addEventListener('click', () => selectBackground('#000000', 'blackBg'));
            document.getElementById('customBg').addEventListener('click', () => bgColorInput.click());
            function applyCustomBackground() {
                document.getElementById('customBg').style.backgroundColor = bgColorInput.value;
                document.getElementById('customBg').style.color =
                    parseInt(bgColorInput.value.slice(1, 3), 16) * 0.299 +
                    parseInt(bgColorInput.value.slice(3, 5), 16) * 0.587 +
                    parseInt(bgColorInput.value.slice(5, 7), 16) * 0.114 > 150 ? '#2c3e50' : '#ffffff';
                selectBackground(bgColorInput.value, 'customBg');
            }
            bgColorInput.addEventListener('input', applyCustomBackground);
            bgColorInput.addEventListener('change', applyCustomBackground);

            document.getElementById('cropButton').addEventListener('click', function () {
                if (cropper) {
                    const requestId = imageRequestId;
                    const fileName = currentFileName ?
                        `edited_${currentFileName.replace(/\.[^/.]+$/, '')}.png` :
                        'edited.png';
                    const width = parseInt(widthInput.value) || null;
                    const height = parseInt(heightInput.value) || null;

                    let canvas;
                    if (width && height) {
                        const cropData = cropper.getData();
                        const scaleX = width / cropData.width;
                        const scaleY = height / cropData.height;
                        const scale = Math.max(scaleX, scaleY);

                        const scaledWidth = Math.round(cropData.width * scale);
                        const scaledHeight = Math.round(cropData.height * scale);

                        const finalWidth = width;
                        const finalHeight = height;

                        // Create temporary canvas for the cropped image
                        const tempCanvas = cropper.getCroppedCanvas({
                            width: scaledWidth,
                            height: scaledHeight,
                            fillColor: cropper.options.fillColor
                        });

                        // Create final canvas with desired dimensions
                        canvas = document.createElement('canvas');
                        canvas.width = finalWidth;
                        canvas.height = finalHeight;
                        const ctx = canvas.getContext('2d');

                        // Fill background if not transparent
                        if (cropper.options.fillColor !== 'transparent') {
                            ctx.fillStyle = cropper.options.fillColor;
                            ctx.fillRect(0, 0, finalWidth, finalHeight);
                        }

                        // Center the scaled image
                        const x = (finalWidth - scaledWidth) / 2;
                        const y = (finalHeight - scaledHeight) / 2;
                        ctx.drawImage(tempCanvas, x, y, scaledWidth, scaledHeight);
                    } else {
                        canvas = cropper.getCroppedCanvas({
                            fillColor: cropper.options.fillColor
                        });
                    }

                    // Convert canvas to blob and send to server
                    canvas.toBlob(function (blob) {
                        if (requestId !== imageRequestId) return;
                        const formData = new FormData();
                        formData.append('editedImage', blob, fileName);

                        // Show loading overlay while processing
                        showLoading();

                        fetch('/upload-edited', {
                            method: 'POST',
                            body: formData
                        })
                            .then(response => response.blob())
                            .then(blob => {
                                if (requestId === imageRequestId) hideLoading();
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = url;
                                a.download = fileName;
                                document.body.appendChild(a);
                                a.click();
                                window.URL.revokeObjectURL(url);
                                document.body.removeChild(a);
                            })
                            .catch(error => {
                                if (requestId !== imageRequestId) return;
                                hideLoading();
                                console.error('Error:', error);
                                alert('Error downloading the edited image. Please try again.');
                            });
                    }, 'image/png');
                }
            });
        </script>
    </div>

</body>

</html>
