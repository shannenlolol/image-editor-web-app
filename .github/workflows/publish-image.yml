# Builds the Docker image when a release tag (vMAJOR.MINOR.PATCH, such as
# v1.1.0) is pushed, and publishes it to GitHub Container Registry, where
# Watchtower on the NAS picks it up. Merging to main alone deploys nothing;
# tag a release when it is ready.
name: Publish image

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Emulates ARM so one run can build for Intel and ARM NASes alike.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag such as v1.1.0 is published as 1.1.0, 1.1 and latest (what the NAS
      # runs), so an earlier release can be pinned if an update misbehaves.
      # Pre-releases such as v1.2.0-rc1 never become latest. Also adds the labels that link the
      # package to this repository.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Skip build attestations, which GHCR lists as extra untagged versions.
          provenance: false
          sbom: false
          # Reuse unchanged layers (mainly the Python packages) between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
