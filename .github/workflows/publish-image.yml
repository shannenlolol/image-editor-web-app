# Builds the Docker image on every push to main and publishes it to GitHub
# Container Registry, where Watchtower on the NAS picks it up. The NAS then
# never builds the image itself.
name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Emulates ARM so one run can build for Intel and ARM NASes alike.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags each image "latest" (what the NAS runs) and with its commit, so an
      # older version can be pinned if an update misbehaves. Also adds the
      # labels that link the package to this repository.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse unchanged layers (mainly the Python packages) between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
